[package]
name = "git-wirdo-core"
version = "0.1.0"
edition = "2024"
description = "Git, GitHub and settings logic for git-wirdo, independent of any user interface"

[features]
# Lets dependent crates script `gh` responses in their own tests; never enabled in release.
mock-gh = []

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp"] }
