name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Rust checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint all targets
        shell: bash
        run: |
          if output=$(cargo clippy --quiet --locked --all-targets --all-features -- -D warnings 2>&1); then
            printf '%s\n' "$output"
          else
            status=$?
            printf '%s\n' "$output"
            # Keep Cargo errors visible in the checks API as well as downloadable logs.
            diagnostic="${output: -3000}"
            diagnostic="${diagnostic//%/%25}"
            diagnostic="${diagnostic//$'\r'/%0D}"
            diagnostic="${diagnostic//$'\n'/%0A}"
            printf '::error title=Cargo Clippy failed::%s\n' "$diagnostic"
            exit "$status"
          fi
      - name: Run tests
        run: cargo test --locked --all-targets --all-features
