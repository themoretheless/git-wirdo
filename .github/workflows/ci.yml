name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Rust checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint all targets
        shell: python
        run: |
          import base64
          import subprocess
          import sys

          result = subprocess.run(
              ["cargo", "clippy", "--locked", "--all-targets", "--all-features", "--", "-D", "warnings"],
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
          )
          print(result.stdout.decode("utf-8", errors="replace"), flush=True)
          if result.returncode:
              diagnostic = base64.b64encode(result.stdout[-1800:]).decode("ascii")
              print(f"::error title=Cargo Clippy failed::Exit {result.returncode}; {len(result.stdout)} output bytes; base64 tail: {diagnostic}", flush=True)
          sys.exit(result.returncode)
      - name: Run tests
        run: cargo test --locked --all-targets --all-features
